name: SEO URL audit (read only)
on:
  workflow_dispatch:
  push:
    branches: ['seo/metadata-ai-20260921']
    paths: ['scripts/audit-seo-urls.mjs', '.github/workflows/seo-url-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node scripts/audit-seo-urls.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-url-audit
          path: seo-url-audit.json
          retention-days: 7
