name: Generate AI SEO descriptions
on:
  push:
    branches: [main]
    paths: ['posts/**', 'scripts/generate-seo-descriptions.mjs', 'scripts/seo-api.mjs', 'src/common/seo-utils.js']
  workflow_dispatch:
    inputs:
      max_posts:
        description: Maximum articles to generate (1-500); matching cached articles are skipped
        default: '200'
        type: string
permissions:
  contents: read
concurrency:
  group: seo-description-cache
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'fx-k/keke.su' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/seo.test.mjs
      - name: Generate descriptions without modifying articles
        id: generate
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          SEO_MAX_POSTS: ${{ inputs.max_posts || vars.SEO_MAX_POSTS || '200' }}
        run: node scripts/generate-seo-descriptions.mjs
      - name: Preserve generated metadata for inspection
        if: always() && steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-descriptions
          path: src/generated/seo-descriptions.json
          retention-days: 7
      - name: Commit only the description cache
        if: always() && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- posts/
          if git diff --quiet -- src/generated/seo-descriptions.json; then exit 0; fi
          # Abort if another push arrived; never force-push or overwrite newer work.
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$CURRENT" != "$(git rev-parse HEAD)" ]; then
            echo '::error::main changed during generation; generated metadata is saved as an artifact. Rerun to reconcile.'
            exit 1
          fi
          python - <<'PY'
          import base64, json, os, pathlib, subprocess
          name = 'src/generated/seo-descriptions.json'
          payload = {
              'message': 'chore(seo): update generated article descriptions',
              'content': base64.b64encode(pathlib.Path(name).read_bytes()).decode(),
              'sha': subprocess.check_output(['git', 'rev-parse', 'HEAD:' + name], text=True).strip(),
              'branch': 'main',
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'seo-commit.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/src/generated/seo-descriptions.json" \
            --input "$RUNNER_TEMP/seo-commit.json" --jq .commit.sha
      - name: Surface partial API failures
        if: always() && steps.generate.outcome == 'failure'
        run: |
          echo '::error::Some descriptions failed. Successful results were preserved; rerun to retry missing entries.'
          exit 1
