name: SEO metadata checks
on:
  push:
    paths: ['src/**', 'scripts/**', 'posts/**', 'site.config.js', 'package*.json', '.github/workflows/seo-check.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'posts/**', 'site.config.js', 'package*.json', '.github/workflows/seo-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit, metadata and persistence tests (mock services only)
        run: npm run test:seo
      - name: Prepare all published descriptions without API or Redis access
        run: npm run seo:check
      - name: Type check
        run: npx tsc --noEmit
      - name: Confirm article files were not modified
        run: git diff --exit-code -- posts/
      - name: Temporary production HTTP regression (no model or database credentials)
        if: github.event_name == 'pull_request'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          OPENAI_API_KEY: ''
          OPENAI_BASE_URL: ''
          OPENAI_MODEL: ''
          UPSTASH_REDIS_REST_URL: 'https://offline-redis.invalid'
          UPSTASH_REDIS_REST_TOKEN: 'offline-test-not-a-secret'
        run: |
          npx next build
          test -f node_modules/html-rewriter-wasm/dist/asyncify.js
          mv node_modules/html-rewriter-wasm/dist/asyncify.js node_modules/html-rewriter-wasm/dist/asyncify.js.qa-disabled
          node node_modules/next/dist/bin/next start -p 3499 >/tmp/keke-not-found-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            mv node_modules/html-rewriter-wasm/dist/asyncify.js.qa-disabled node_modules/html-rewriter-wasm/dist/asyncify.js
            cat /tmp/keke-not-found-server.log
          }
          trap cleanup EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const origin = 'http://127.0.0.1:3499'
          let ready = false
          for (let i = 0; i < 60; i++) {
            try { const r = await fetch(origin); await r.body?.cancel(); if (r.status === 200) { ready = true; break } } catch {}
            await new Promise(resolve => setTimeout(resolve, 500))
          }
          assert.ok(ready, 'Next production server did not become ready')
          const tests = [
            ['/posts/__not-found-check-20260921.html', 404],
            ['/posts/__not-found-check-20260921', 404],
            ['/tags/__not-found-check-20260921', 404],
            ['/tags/' + encodeURIComponent('不存在的测试标签'), 404],
            ['/404', 404],
            ['/posts/2026-09-20-new-1.html', 200],
            ['/posts/2026-09-20-new-1', 200],
            ['/posts/2026-09-15-new-1.html', 200],
            ['/tags/' + encodeURIComponent('技术向'), 200],
            ['/posts', 200],
          ]
          const results = []
          for (const [path, expected] of tests) {
            const response = await fetch(origin + path, { redirect: 'manual', signal: AbortSignal.timeout(15000) })
            const body = await response.text()
            const title = body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]
            const row = { path, expected, actual: response.status, title, location: response.headers.get('location') }
            results.push(row)
            console.log('HTTP_CASE ' + JSON.stringify(row))
            assert.equal(response.status, expected, path)
            assert.equal(response.headers.get('location'), null, 'Unexpected redirect: ' + path)
            if (expected === 404) assert.ok(!body.includes('Internal Server Error'), path)
            if (expected === 200 && path.startsWith('/posts/')) {
              assert.ok(body.includes('<article'), 'Missing article body: ' + path)
              const slug = path.split('/').at(-1).replace(/\.html$/, '')
              assert.ok(body.includes('https://keke.su/posts/' + slug + '.html'), 'Wrong canonical: ' + path)
            }
            if (path === '/tags/' + encodeURIComponent('技术向')) assert.ok(body.includes('/posts/2026-09-20-new-1.html'), 'Missing tag article')
          }
          const report = { tested: results.length, removedDependency: 'html-rewriter-wasm/dist/asyncify.js', results }
          console.log('NOT_FOUND_HTTP ' + JSON.stringify(report))
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Production HTTP regression\n\n```json\n' + JSON.stringify(report, null, 2) + '\n```\n')
          NODE
          git diff --exit-code -- posts/
