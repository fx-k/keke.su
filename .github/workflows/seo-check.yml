name: SEO metadata checks
on:
  push:
    branches: [main, 'seo/metadata-ai-20260921']
    paths: ['src/**', 'scripts/**', 'posts/**', '.github/workflows/seo-check.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'posts/**', '.github/workflows/seo-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/seo.test.mjs
      - name: Verify all published posts have descriptions (no API)
        run: node scripts/generate-seo-descriptions.mjs --dry-run
      - name: Type check
        run: npx tsc --noEmit
